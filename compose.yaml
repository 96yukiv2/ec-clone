services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ec
      POSTGRES_PASSWORD: ec
      POSTGRES_DB: ec
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ec -d ec"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]
  api:
    image: node:22-alpine
    working_dir: /app
    volumes: [".:/app", "api_modules:/app/node_modules"]
    environment:
      DATABASE_URL: postgres://ec:ec@postgres:5432/ec
      REDIS_URL: redis://redis:6379
      PORT: "4000"
      NODE_ENV: development
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
    command: sh -c "corepack enable && corepack prepare pnpm@10.11.0 --activate && pnpm install --no-frozen-lockfile && pnpm --filter @ec/api db:push && pnpm --filter @ec/api seed && pnpm --filter @ec/api dev"
  web:
    image: node:22-alpine
    working_dir: /app
    volumes: [".:/app", "web_modules:/app/node_modules"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_INTERNAL_URL: http://api:4000
    ports: ["3000:3000"]
    depends_on: [api]
    command: sh -c "corepack enable && corepack prepare pnpm@10.11.0 --activate && pnpm install --no-frozen-lockfile && pnpm --filter @ec/web dev"
volumes:
  pgdata:
  api_modules:
  web_modules:
