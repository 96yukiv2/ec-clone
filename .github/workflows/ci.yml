name: ECサイト CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 単体・結合・E2E・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ec
          POSTGRES_PASSWORD: ec
          POSTGRES_DB: ec_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ec -d ec_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: 'true'
      DATABASE_URL: postgres://ec:ec@localhost:5433/ec_test
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_INTERNAL_URL: http://localhost:4000
      PORT: '4000'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 依存関係をインストール
        run: pnpm install --no-frozen-lockfile
      - name: テスト専用DBを作成
        run: |
          pnpm --filter @ec/api db:push
          pnpm --filter @ec/api db:optimize
          pnpm --filter @ec/api seed
      - name: バックエンド単体テスト
        run: pnpm --filter @ec/api test
      - name: フロントエンド単体テスト
        run: pnpm --filter @ec/web test
      - name: API結合テスト
        run: pnpm --filter @ec/api test:integration
      - name: バックエンドビルド
        run: pnpm --filter @ec/api build
      - name: フロントエンドビルド
        run: pnpm --filter @ec/web build
      - name: ブラウザ導入
        run: pnpm --filter @ec/web exec playwright install --with-deps chromium
      - name: 画面E2Eテスト
        run: pnpm --filter @ec/web e2e

  docker-smoke:
    name: Docker Compose起動・購入フロー
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compose定義検証
        run: docker compose config -q
      - name: ローカルEC環境起動
        run: docker compose up --detach --wait --wait-timeout 300
      - name: API・Web・Mock注文を検証
        run: node scripts/smoke.mjs
      - name: 商品検索の簡易負荷テスト
        run: node scripts/load.mjs
      - name: 失敗時にサービスログを表示
        if: failure()
        run: docker compose logs --tail=180
      - name: コンテナ停止
        if: always()
        run: docker compose down --volumes
