name: CI（単体・結合・画面E2E・ビルド）
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ec
          POSTGRES_PASSWORD: ec
          POSTGRES_DB: ec_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ec -d ec_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: 'true'
      DATABASE_URL: postgres://ec:ec@localhost:5433/ec_test
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_INTERNAL_URL: http://localhost:4000
      PORT: '4000'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 依存関係をインストール
        run: pnpm install --no-frozen-lockfile
      - name: テスト用DBを作成
        run: |
          pnpm --filter @ec/api db:push
          pnpm --filter @ec/api db:optimize
          pnpm --filter @ec/api seed
      - name: 単体テスト（バックエンド）
        run: pnpm --filter @ec/api test
      - name: 単体テスト（フロントエンド）
        run: pnpm --filter @ec/web test
      - name: API結合テスト
        run: pnpm --filter @ec/api test:integration
      - name: バックエンドのビルド
        run: pnpm --filter @ec/api build
      - name: フロントエンドのビルド
        run: pnpm --filter @ec/web build
      - name: Playwrightブラウザを導入
        run: pnpm --filter @ec/web exec playwright install --with-deps chromium
      - name: 画面E2Eテスト
        run: pnpm --filter @ec/web e2e
